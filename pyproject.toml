[project]
name = "qoder-adapter"
version = "1.0.0"
description = "OpenAI-compatible loopback sidecar for Qoder PAT accounts (PAT -> JT pool, Cosy signing, Encode=1 transport)"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9.0",
  "httpx>=0.27.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
